name: Website Scraper

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

# ✅ REQUIRED for pushing changes
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run scraper
        run: npm run scrape

      # ✅ NEW: Commit and push matches.json
      - name: Commit and push matches.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add matches.json

          # Only commit if file changed
          git diff --cached --quiet || git commit -m "Update matches.json"

          git pus
