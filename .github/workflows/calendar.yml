name: Calendar Scraper

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"   # ✅ speeds up installs

      - name: Install dependencies
        run: npm install

      # ❌ REMOVE this (not needed anymore)
      # - name: Install Playwright browser
      #   run: npx playwright install --with-deps

      - name: Run calendar scraper
        run: node calender-scraper.js

      - name: Commit and push calendar.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add calendar.json

          # Only commit if file changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update calendar data"
            git push
          fi
