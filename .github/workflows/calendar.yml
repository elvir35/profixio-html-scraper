name: Calendar Scraper

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm install

      - name: Run calendar scraper
        run: npm run scrape:calendar

      # 🔍 Debug: verify files exist
      - name: List files
        run: ls -la

      - name: Commit and push calendar + debug HTML
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      
          git add calendar.json
          git add debug.html
      
          # Always commit (even if no changes)
          git commit -m "🤖 Update calendar data + debug HTML" --allow-empty
      
          git push
